name: lex-clt

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lex_clt}
      POSTGRES_USER: ${POSTGRES_USER:-lex_clt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a senha em .env.pgvector.local}
    ports:
      - "127.0.0.1:${PGVECTOR_PORT:-15432}:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgvector_data:
